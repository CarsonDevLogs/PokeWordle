<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pokémon Wordle</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --correct: #4CAF50;
    --present: #FF9800;
    --absent: #607D8B;
    --bg: #1a1a2e;
    --surface: #16213e;
    --card: #0f3460;
    --text: #e0e0e0;
    --text-dim: #90a4ae;
    --border: #1e3a5f;
    --tile-bg: #0f3460;
    --tile-border: #2a4a7f;
    --key-bg: #1e3a5f;
    --key-text: #e0e0e0;
    --accent: #e94560;
    --gold: #ffd700;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'Inter', sans-serif;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    overflow-x: hidden;
  }

  /* Pokéball bg decoration */
  body::before {
    content: '';
    position: fixed;
    top: -200px; right: -200px;
    width: 500px; height: 500px;
    border-radius: 50%;
    border: 80px solid rgba(233,69,96,0.06);
    pointer-events: none;
    z-index: 0;
  }
  body::after {
    content: '';
    position: fixed;
    bottom: -150px; left: -150px;
    width: 400px; height: 400px;
    border-radius: 50%;
    border: 60px solid rgba(255,215,0,0.05);
    pointer-events: none;
    z-index: 0;
  }

  header {
    width: 100%;
    max-width: 600px;
    padding: 20px 20px 12px;
    text-align: center;
    position: relative;
    z-index: 1;
  }

  .logo {
    font-family: 'Press Start 2P', monospace;
    font-size: clamp(14px, 4vw, 22px);
    color: var(--gold);
    text-shadow: 3px 3px 0 var(--accent), 6px 6px 0 rgba(233,69,96,0.3);
    letter-spacing: 1px;
    margin-bottom: 6px;
  }

  .subtitle {
    font-size: 11px;
    color: var(--text-dim);
    letter-spacing: 2px;
    text-transform: uppercase;
  }

  .divider {
    width: 100%;
    height: 1px;
    background: linear-gradient(90deg, transparent, var(--accent), var(--gold), var(--accent), transparent);
    margin: 12px 0;
    opacity: 0.5;
  }

  .stats-row {
    display: flex;
    justify-content: center;
    gap: 24px;
    font-size: 11px;
    color: var(--text-dim);
    padding: 4px 0 12px;
  }

  .stat { text-align: center; }
  .stat-num { font-size: 18px; font-weight: 700; color: var(--gold); display: block; }

  main {
    width: 100%;
    max-width: 600px;
    padding: 0 12px;
    position: relative;
    z-index: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 16px;
  }

  /* Message banner */
  #message {
    min-height: 32px;
    font-size: 13px;
    font-weight: 600;
    text-align: center;
    color: var(--gold);
    letter-spacing: 0.5px;
    transition: opacity 0.3s;
    font-family: 'Press Start 2P', monospace;
    font-size: 9px;
    line-height: 1.6;
  }

  /* Game board */
  #board {
    display: flex;
    flex-direction: column;
    gap: 6px;
  }

  .row {
    display: flex;
    gap: 6px;
  }

  .tile {
    width: 52px;
    height: 52px;
    border: 2px solid var(--tile-border);
    background: var(--tile-bg);
    border-radius: 6px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: 'Press Start 2P', monospace;
    font-size: clamp(8px, 2.5vw, 11px);
    color: var(--text);
    text-transform: uppercase;
    transition: border-color 0.1s, transform 0.08s;
    position: relative;
    overflow: hidden;
  }

  .tile.filled {
    border-color: #4a6fa5;
    animation: pop 0.1s ease;
  }

  .tile.correct {
    background: var(--correct);
    border-color: var(--correct);
    color: #fff;
  }

  .tile.present {
    background: var(--present);
    border-color: var(--present);
    color: #fff;
  }

  .tile.absent {
    background: var(--absent);
    border-color: var(--absent);
    color: #fff;
  }

  .tile.flip {
    animation: flip 0.5s ease forwards;
  }

  .tile.shake { animation: shake 0.5s ease; }
  .tile.bounce { animation: bounce 0.5s ease; }
  .tile.win { animation: winPulse 0.6s ease forwards; }

  @keyframes pop {
    0% { transform: scale(1); }
    50% { transform: scale(1.12); }
    100% { transform: scale(1); }
  }

  @keyframes flip {
    0%   { transform: rotateX(0deg); }
    50%  { transform: rotateX(-90deg); }
    100% { transform: rotateX(0deg); }
  }

  @keyframes shake {
    0%,100% { transform: translateX(0); }
    20%     { transform: translateX(-6px); }
    40%     { transform: translateX(6px); }
    60%     { transform: translateX(-4px); }
    80%     { transform: translateX(4px); }
  }

  @keyframes bounce {
    0%,100% { transform: translateY(0); }
    40%     { transform: translateY(-16px); }
    70%     { transform: translateY(-8px); }
  }

  @keyframes winPulse {
    0%   { transform: scale(1); box-shadow: 0 0 0 0 rgba(255,215,0,0.7); }
    50%  { transform: scale(1.15); box-shadow: 0 0 0 10px rgba(255,215,0,0); }
    100% { transform: scale(1); }
  }

  /* Keyboard */
  #keyboard {
    display: flex;
    flex-direction: column;
    gap: 7px;
    align-items: center;
    width: 100%;
    max-width: 500px;
  }

  .key-row { display: flex; gap: 5px; }

  .key {
    height: 52px;
    min-width: 36px;
    padding: 0 8px;
    border-radius: 6px;
    border: 1px solid var(--border);
    background: var(--key-bg);
    color: var(--key-text);
    font-family: 'Inter', sans-serif;
    font-size: 13px;
    font-weight: 600;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    text-transform: uppercase;
    transition: background 0.15s, transform 0.08s, border-color 0.15s;
    user-select: none;
    -webkit-tap-highlight-color: transparent;
  }

  .key:active { transform: scale(0.94); }

  .key.wide {
    min-width: 58px;
    font-size: 11px;
    letter-spacing: -0.3px;
  }

  .key.correct { background: var(--correct); border-color: var(--correct); color: #fff; }
  .key.present { background: var(--present); border-color: var(--present); color: #fff; }
  .key.absent  { background: #374151; border-color: #374151; color: #6b7280; }

  /* Info panel */
  .hint-panel {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 12px 20px;
    text-align: center;
    width: 100%;
    max-width: 400px;
  }

  .hint-label {
    font-size: 10px;
    color: var(--text-dim);
    text-transform: uppercase;
    letter-spacing: 1.5px;
    margin-bottom: 6px;
  }

  .hint-text {
    font-size: 13px;
    color: var(--gold);
    font-weight: 600;
  }

  /* Legend */
  .legend {
    display: flex;
    gap: 16px;
    justify-content: center;
    flex-wrap: wrap;
    font-size: 11px;
    color: var(--text-dim);
  }

  .legend-item { display: flex; align-items: center; gap: 6px; }

  .legend-dot {
    width: 14px; height: 14px; border-radius: 3px;
  }

  /* End modal */
  #modal-overlay {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(10,10,20,0.88);
    z-index: 100;
    align-items: center;
    justify-content: center;
    padding: 20px;
    backdrop-filter: blur(6px);
  }
  #modal-overlay.show { display: flex; }

  .modal {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 32px 28px 24px;
    max-width: 380px;
    width: 100%;
    text-align: center;
    animation: slideUp 0.35s cubic-bezier(0.175, 0.885, 0.32, 1.275);
  }

  @keyframes slideUp {
    from { opacity: 0; transform: translateY(40px) scale(0.95); }
    to   { opacity: 1; transform: translateY(0) scale(1); }
  }

  .modal-icon { font-size: 48px; margin-bottom: 12px; }

  .modal-title {
    font-family: 'Press Start 2P', monospace;
    font-size: 13px;
    color: var(--gold);
    margin-bottom: 8px;
    line-height: 1.6;
  }

  .modal-answer {
    font-family: 'Press Start 2P', monospace;
    font-size: 11px;
    color: var(--accent);
    margin: 10px 0 6px;
    letter-spacing: 1px;
    text-transform: uppercase;
  }

  .modal-desc {
    font-size: 12px;
    color: var(--text-dim);
    margin-bottom: 20px;
    line-height: 1.6;
  }

  .modal-stats {
    display: flex;
    justify-content: center;
    gap: 20px;
    margin-bottom: 20px;
    padding: 14px;
    background: var(--card);
    border-radius: 10px;
  }

  .modal-stat { text-align: center; }
  .modal-stat-num { font-size: 22px; font-weight: 700; color: var(--gold); display: block; }
  .modal-stat-lbl { font-size: 10px; color: var(--text-dim); }

  .btn {
    display: inline-block;
    padding: 12px 28px;
    border-radius: 8px;
    font-family: 'Press Start 2P', monospace;
    font-size: 9px;
    cursor: pointer;
    border: none;
    transition: transform 0.1s, opacity 0.15s;
    letter-spacing: 0.5px;
  }

  .btn:active { transform: scale(0.96); }

  .btn-primary {
    background: linear-gradient(135deg, var(--accent), #c0392b);
    color: #fff;
  }

  .btn-secondary {
    background: var(--card);
    color: var(--gold);
    border: 1px solid var(--border);
    margin-top: 10px;
  }

  /* Type badges */
  .type-badge {
    display: inline-block;
    padding: 3px 10px;
    border-radius: 20px;
    font-size: 10px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.5px;
    margin: 2px;
  }

  /* Pokéball spinner */
  .pokeball {
    width: 40px; height: 40px;
    border-radius: 50%;
    border: 4px solid var(--gold);
    border-top-color: var(--accent);
    animation: spin 0.8s linear infinite;
    margin: 0 auto 8px;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  footer {
    padding: 20px;
    text-align: center;
    font-size: 10px;
    color: var(--text-dim);
    z-index: 1;
    opacity: 0.6;
  }

  /* Responsive tile sizes */
  @media (max-width: 380px) {
    .tile { width: 44px; height: 44px; font-size: 9px; }
    .key  { height: 46px; min-width: 30px; font-size: 12px; }
    .key.wide { min-width: 50px; }
  }
</style>
</head>

    <button class="btn btn-primary" onclick="newGame()">⚡ New Pokémon</button><br>
    <button class="btn btn-secondary" onclick="closeModal()">Keep viewing</button>

</div>

// ─── Build Board ──────────────────────────────────────────────────────────────
function buildBoard() {
  const b = document.getElementById("board");
  b.innerHTML = "";
  board = [];
  for (let r = 0; r < MAX_GUESSES; r++) {
    const row = document.createElement("div");
    row.className = "row";
    const rowTiles = [];
    for (let c = 0; c < WORD_LEN; c++) {
      const tile = document.createElement("div");
      tile.className = "tile";
      row.appendChild(tile);
      rowTiles.push(tile);
    }
    b.appendChild(row);
    board.push(rowTiles);
  }
}

const ROWS = ["QWERTYUIOP", "ASDFGHJKL", "↵ZXCVBNM⌫"];
function buildKeyboard() {
  const kb = document.getElementById("keyboard");
  kb.innerHTML = "";
  ROWS.forEach(rowStr => {
    const row = document.createElement("div");
    row.className = "key-row";
    [...rowStr].forEach(ch => {
      const key = document.createElement("button");
      key.className = "key" + (ch === "↵" || ch === "⌫" ? " wide" : "");
      key.textContent = ch === "↵" ? "ENTER" : ch === "⌫" ? "DEL" : ch;
      key.dataset.key = ch;
      key.addEventListener("click", () => handleKey(ch));
      row.appendChild(key);
    });
    kb.appendChild(row);
  });
}

// ─── Input ────────────────────────────────────────────────────────────────────
document.addEventListener("keydown", e => {
  if (gameOver) return;
  if (e.key === "Enter") handleKey("↵");
  else if (e.key === "Backspace") handleKey("⌫");
  else if (/^[a-zA-Z]$/.test(e.key)) handleKey(e.key.toUpperCase());
});

function handleKey(ch) {
  if (gameOver) return;
  if (ch === "⌫") deleteLetter();
  else if (ch === "↵") submitGuess();
  else addLetter(ch);
}

function addLetter(ch) {
  if (currentCol >= WORD_LEN) return;
  board[currentRow][currentCol].textContent = ch;
  board[currentRow][currentCol].classList.add("filled");
  currentCol++;
}

function deleteLetter() {
  if (currentCol <= 0) return;
  currentCol--;
  board[currentRow][currentCol].textContent = "";
  board[currentRow][currentCol].classList.remove("filled");
}

// ─── Submit & Evaluate ───────────────────────────────────────────────────────
function submitGuess() {
  if (currentCol < WORD_LEN) { shakeRow(currentRow); showMsg("Not enough letters!"); return; }
  const guess = board[currentRow].map(t => t.textContent).join("");
  const result = evaluate(guess, target);

  // Flip tiles with delays
  result.forEach((state, i) => {
    const tile = board[currentRow][i];
    setTimeout(() => {
      tile.classList.add("flip");
      setTimeout(() => {
        tile.classList.add(state);
        tile.classList.remove("flip");
        if (i === WORD_LEN - 1) afterReveal(guess, result);
      }, 250);
    }, i * 120);
  });

  // Update keyboard
  result.forEach((state, i) => {
    const ch = guess[i];
    const prev = letterStates[ch];
    if (prev === "correct") return;
    if (prev === "present" && state === "absent") return;
    letterStates[ch] = state;
  });
  setTimeout(updateKeyboard, WORD_LEN * 120 + 260);
}

function evaluate(guess, target) {
  const result = Array(WORD_LEN).fill("absent");
  const tArr = [...target], used = Array(WORD_LEN).fill(false);
  // First pass: correct
  for (let i = 0; i < WORD_LEN; i++) {
    if (guess[i] === tArr[i]) { result[i] = "correct"; used[i] = true; }
  }
  // Second pass: present
  for (let i = 0; i < WORD_LEN; i++) {
    if (result[i] === "correct") continue;
    const j = tArr.findIndex((c, k) => !used[k] && c === guess[i]);
    if (j !== -1) { result[i] = "present"; used[j] = true; }
  }
  return result;
}

function afterReveal(guess, result) {
  const won = result.every(r => r === "correct");
  currentRow++;
  currentCol = 0;

  if (won) {
    stats.played++; stats.won++; stats.streak++; stats.best = Math.max(stats.best, stats.streak);
    saveStats();
    gameOver = true;
    const msgs = ["🏆 Caught it!","⚡ Outstanding!","🌟 Pokémaster!","🎯 Got it!","✨ Brilliant!","🔥 Flawless!"];
    showMsg(msgs[Math.min(currentRow-1, msgs.length-1)]);
    board[currentRow-1].forEach((t,i) => setTimeout(() => t.classList.add("win"), i * 80));
    setTimeout(() => showModal(true), 1400);
  } else if (currentRow >= MAX_GUESSES) {
    stats.played++; stats.streak = 0;
    saveStats();
    gameOver = true;
    showMsg("It was " + target + "...");
    setTimeout(() => showModal(false), 1200);
  }
}

// ─── UI Helpers ───────────────────────────────────────────────────────────────
let msgTimer;
function showMsg(text, dur = 2800) {
  const el = document.getElementById("message");
  el.textContent = text;
  clearTimeout(msgTimer);
  if (dur > 0) msgTimer = setTimeout(() => { el.textContent = ""; }, dur);
}

function shakeRow(row) {
  board[row].forEach(t => {
    t.classList.remove("shake");
    void t.offsetWidth;
    t.classList.add("shake");
  });
}

function updateKeyboard() {
  document.querySelectorAll(".key").forEach(k => {
    const ch = k.dataset.key;
    const st = letterStates[ch];
    k.classList.remove("correct","present","absent");
    if (st) k.classList.add(st);
  });
}

// ─── Stats ────────────────────────────────────────────────────────────────────
function saveStats() {
  localStorage.setItem("pkWordle", JSON.stringify(stats));
  renderStats();
}

function renderStats() {
  document.getElementById("s-played").textContent = stats.played;
  document.getElementById("s-won").textContent = stats.won;
  document.getElementById("s-streak").textContent = stats.streak;
  document.getElementById("s-best").textContent = stats.best;
}

// ─── Modal ────────────────────────────────────────────────────────────────────
function showModal(won) {
  document.getElementById("modal-icon").textContent = won ? "🏆" : "😞";
  document.getElementById("modal-title").textContent = won ? "You caught it!" : "Better luck next time!";
  document.getElementById("modal-answer").textContent = target;
  document.getElementById("modal-desc").textContent = targetHint;
  const pct = stats.played ? Math.round(stats.won / stats.played * 100) : 0;
  document.getElementById("ms-played").textContent = stats.played;
  document.getElementById("ms-pct").textContent = pct + "%";
  document.getElementById("ms-streak").textContent = stats.streak;
  document.getElementById("modal-overlay").classList.add("show");
}

function closeModal() {
  document.getElementById("modal-overlay").classList.remove("show");
}

// ─── New Game ─────────────────────────────────────────────────────────────────
function newGame() {
  closeModal();
  const pick = pool[Math.floor(Math.random() * pool.length)];
  target = pick.w;
  targetHint = pick.h;
  document.getElementById("hint-text").textContent = targetHint;
  currentRow = 0; currentCol = 0; gameOver = false; letterStates = {};
  buildBoard();
  buildKeyboard();
  showMsg("", 0);
  renderStats();
}

// ─── Init ────────────────────────────────────────────────────────────────────
renderStats();
newGame();
</script>
